name: Build InteractiveBrokers App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Cordova & Create Project
        run: |
          npm install -g cordova
          cordova create myapp com.personal.interactivebrokers "InteractiveBrokers"
          
      - name: Copy Static Files into App
        run: |
          rm -rf myapp/www/*
          cp index.html myapp/www/
          cp styles.css myapp/www/
          cp script.js myapp/www/
          if [ -f "icon.png" ]; then
            cp icon.png myapp/www/
          fi

      - name: Add iOS Platform
        run: |
          cd myapp
          cordova platform add ios

      - name: Inject Custom Icon Config
        run: |
          cd myapp
          if [ -f "www/icon.png" ]; then
            echo '<widget id="com.personal.interactivebrokers" version="1.0.0" xmlns="http://w3.org" xmlns:cdv="http://apache.org">' >> config.xml
            echo '  <name>InteractiveBrokers</name>' >> config.xml
            echo '  <icon src="www/icon.png" />' >> config.xml
            echo '</widget>' >> config.xml
          fi

      - name: Compile and Package App Bundle
        run: |
          cd myapp/platforms/ios
          mkdir -p Payload
          xcodebuild -project InteractiveBrokers.xcodeproj -scheme InteractiveBrokers -configuration Debug -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build
          mv build/Debug-iphoneos/InteractiveBrokers.app Payload/
          zip -r ../../InteractiveBrokers.ipa Payload

      - name: Upload Finished App File
        uses: actions/upload-artifact@v4
        with:
          name: InteractiveBrokers-iOS-Installer
          path: InteractiveBrokers.ipa
